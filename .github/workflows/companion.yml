name: Companion native builds

on:
  pull_request:
    paths:
      - "apps/desktop/**"
      - "apps/api/src/companion/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - ".github/workflows/companion.yml"
      - ".github/workflows/publish-desktop.yml"
      - ".github/workflows/deploy-dokploy.yml"
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "apps/api/src/companion/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - ".github/workflows/companion.yml"
      - ".github/workflows/publish-desktop.yml"
      - ".github/workflows/deploy-dokploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: companion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: ${{ matrix.name }} (unsigned publisher)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64 AppImage
            artifact: linux-x64
            os: ubuntu-22.04
            targets: x86_64-unknown-linux-gnu
            args: --target x86_64-unknown-linux-gnu --bundles appimage
          - name: Windows x64 NSIS
            artifact: windows-x64
            os: windows-latest
            targets: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc --bundles nsis
          - name: Universal macOS DMG
            artifact: macos-universal
            os: macos-latest
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles dmg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          cache: pnpm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1
          targets: ${{ matrix.targets }}
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            apps/desktop/src-tauri -> target
            apps/desktop/engine -> target
      - name: Linux native prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -o APT::Update::Error-Mode=any -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y libwebkit2gtk-4.1-dev webkit2gtk-driver libayatana-appindicator3-dev librsvg2-dev patchelf xvfb dbus-daemon gnome-keyring minisign python3-gi gir1.2-glib-2.0
      - run: pnpm install --filter @shadow-cloud/desktop... --frozen-lockfile
      - name: Check shared release and protocol
        run: node apps/desktop/scripts/check-release.mjs
      - run: pnpm --filter @shadow-cloud/desktop typecheck
      - run: pnpm --filter @shadow-cloud/desktop test
      - run: pnpm --filter @shadow-cloud/desktop test:engine
      - name: Test signed release validation with synthetic keys
        if: runner.os == 'Linux'
        run: node --test apps/desktop/scripts/verify-release.test.mjs
      - name: Linux browser accessibility and acceptance
        if: runner.os == 'Linux'
        env:
          COMPANION_BROWSER_OUTPUT: ${{ runner.temp }}/companion-browser
        run: |
          pnpm --filter @shadow-cloud/desktop exec playwright install --with-deps chromium
          pnpm --filter @shadow-cloud/desktop test:browser
      - name: Build web assets for native test context
        run: pnpm --filter @shadow-cloud/desktop build
      - name: Test native integration and coordinator on the host platform
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked
      - name: Build native distribution (no publisher credentials)
        run: pnpm --filter @shadow-cloud/desktop build:native ${{ matrix.args }}
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
      - name: Launch Linux AppImage (startup only)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mapfile -t bundles < <(find apps/desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage -maxdepth 1 -name '*.AppImage' -type f)
          test "${#bundles[@]}" -eq 1
          dbus-run-session -- xvfb-run -a node apps/desktop/scripts/smoke-native.mjs "${bundles[0]}" --appimage-extract-and-run
      - name: Exercise the packaged Linux webview
        if: runner.os == 'Linux'
        env:
          COMPANION_NATIVE_OUTPUT: ${{ runner.temp }}/companion-native
        run: |
          cargo install tauri-driver --version 2.0.6 --locked
          xvfb-run -a node apps/desktop/scripts/native-webview.mjs apps/desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/shadow-cloud-companion
      - name: Exercise the native folder picker with an isolated synthetic account
        if: runner.os == 'Linux'
        env:
          TAURI_CONFIG: '{"build":{"devUrl":"http://127.0.0.1:1437"}}'
          SHADOW_CLOUD_API_URL: http://127.0.0.1:1460
          SHADOW_CLOUD_WEB_URL: http://127.0.0.1:1460
          COMPANION_NATIVE_OUTPUT: ${{ runner.temp }}/companion-native-picker
        run: |
          cargo build --manifest-path apps/desktop/src-tauri/Cargo.toml --locked
          xvfb-run -a node apps/desktop/scripts/native-webview.mjs apps/desktop/src-tauri/target/debug/shadow-cloud-companion --picker
      - name: Launch macOS application bundle (startup only)
        if: runner.os == 'macOS'
        run: |
          lipo -verify_arch arm64 x86_64 "apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/Shadow Cloud Companion.app/Contents/MacOS/shadow-cloud-companion"
          node apps/desktop/scripts/smoke-native.mjs "apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/Shadow Cloud Companion.app/Contents/MacOS/shadow-cloud-companion"
      - name: Install and launch Windows NSIS (startup only)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis -Filter *.exe)
          if ($installers.Count -ne 1) { throw "Expected one NSIS installer" }
          $companionInstall = Join-Path $env:RUNNER_TEMP 'companion-smoke'
          $install = Start-Process -FilePath $installers[0].FullName -ArgumentList '/S', "/D=$companionInstall" -PassThru -Wait
          if ($install.ExitCode -ne 0) { throw "NSIS installation failed: $($install.ExitCode)" }
          node apps/desktop/scripts/smoke-native.mjs "$companionInstall/shadow-cloud-companion.exe"
      - name: Label unsigned publisher artifacts
        run: node --input-type=module -e "import { writeFileSync } from 'node:fs'; writeFileSync(process.env.RUNNER_TEMP + '/PUBLISHER-NOTICE.txt', 'OS publisher signing and macOS notarization are deferred. These CI installers are unsigned and are not updater releases.');"
      - name: Retain native acceptance artifacts (unsigned publisher)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: companion-${{ matrix.artifact }}-unsigned-publisher-notarization-deferred
          if-no-files-found: error
          retention-days: 14
          path: |
            apps/desktop/src-tauri/target/**/release/bundle/**/*.AppImage
            apps/desktop/src-tauri/target/**/release/bundle/**/*.dmg
            apps/desktop/src-tauri/target/**/release/bundle/nsis/*.exe
            ${{ runner.temp }}/PUBLISHER-NOTICE.txt
      - name: Retain Linux acceptance evidence
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: companion-linux-acceptance
          retention-days: 14
          path: |
            ${{ runner.temp }}/companion-native
            ${{ runner.temp }}/companion-native-picker
            ${{ runner.temp }}/companion-browser
