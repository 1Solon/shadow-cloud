name: Publish and Deploy Containers

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release_tag:
        description: Semantic release tag to deploy (for example, 0.11.0)
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: railway-production
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate release
    runs-on: ubuntu-latest
    outputs:
      image_namespace: ${{ steps.release.outputs.image_namespace }}
      release_sha: ${{ steps.release.outputs.release_sha }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out deployment branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.20.0

      - name: Validate release version
        id: release
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
        run: |
          set -euo pipefail

          git fetch --force --tags origin
          if ! release_sha="$(git rev-parse --verify "$RELEASE_TAG^{commit}" 2>/dev/null)"; then
            echo "Release tag $RELEASE_TAG does not exist or does not point to a commit." >&2
            exit 1
          fi

          if ! git merge-base --is-ancestor "$release_sha" HEAD; then
            echo "Release $RELEASE_TAG is not contained in $DEFAULT_BRANCH." >&2
            exit 1
          fi

          version="${RELEASE_TAG#refs/tags/}"
          version="${version#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag $RELEASE_TAG is not semantic." >&2
            exit 1
          fi
          export RELEASE_VERSION="$version"

          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";

          const expectedVersion = process.env.RELEASE_VERSION;
          const versions = new Map([
            ["package.json", JSON.parse(readFileSync("package.json", "utf8")).version],
            [
              "apps/desktop/src-tauri/tauri.conf.json",
              JSON.parse(readFileSync("apps/desktop/src-tauri/tauri.conf.json", "utf8")).version,
            ],
          ]);

          for (const [path, pattern] of [
            ["apps/desktop/src-tauri/Cargo.toml", /\[package\][\s\S]*?\nversion\s*=\s*"([^"]+)"/],
            ["apps/desktop/src-tauri/Cargo.lock", /\[\[package\]\]\r?\nname\s*=\s*"shadow-cloud-desktop"\r?\nversion\s*=\s*"([^"]+)"/],
          ]) {
            const match = readFileSync(path, "utf8").match(pattern);
            if (!match) throw new Error(`Version not found in ${path}.`);
            versions.set(path, match[1]);
          }

          const mismatches = [...versions].filter(
            ([, currentVersion]) => currentVersion !== expectedVersion,
          );
          if (mismatches.length > 0) {
            const details = mismatches
              .map(([path, currentVersion]) => `${path}: ${currentVersion}`)
              .join("\n");
            throw new Error(
              `Release ${expectedVersion} does not match the deployment branch:\n${details}\n` +
                "Bump versions through a pull request before publishing or manually dispatching the release.",
            );
          }
          NODE

          echo "image_namespace=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build and publish ${{ matrix.service }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: API
            image: shadow-cloud/api
            cache_scope: shadow-cloud-api
            dockerfile: apps/api/Dockerfile
          - service: Web
            image: shadow-cloud/web
            cache_scope: shadow-cloud-web
            dockerfile: apps/web/Dockerfile
          - service: Bot
            image: shadow-cloud/bot
            cache_scope: shadow-cloud-bot
            dockerfile: apps/bot/Dockerfile
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build and publish image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          build-args: |
            SHADOW_CLOUD_VERSION=${{ needs.prepare.outputs.version }}
          tags: |
            ${{ needs.prepare.outputs.image_namespace }}/${{ matrix.image }}:${{ needs.prepare.outputs.version }}
            ${{ needs.prepare.outputs.image_namespace }}/${{ matrix.image }}:latest
            ${{ needs.prepare.outputs.image_namespace }}/${{ matrix.image }}:sha-${{ needs.prepare.outputs.release_sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.release_sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}

  deploy:
    name: Deploy to Railway
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy release images to Railway
        shell: bash
        env:
          IMAGE_NAMESPACE: ${{ needs.prepare.outputs.image_namespace }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s inherit_errexit

          if [[ -z "$RAILWAY_TOKEN" ]]; then
            echo "The RAILWAY_TOKEN repository secret is not configured." >&2
            exit 1
          fi

          # RAILWAY_TOKEN is a project token scoped to the production environment,
          # so the project and environment are resolved from the token itself.
          railway_graphql() {
            local query="$1"
            local variables="${2:-}"
            local response

            if [[ -z "$variables" ]]; then
              variables='{}'
            fi

            response="$(curl \
              --silent \
              --show-error \
              --fail-with-body \
              --header "Project-Access-Token: $RAILWAY_TOKEN" \
              --header 'Content-Type: application/json' \
              --data "$(jq -n --arg query "$query" --argjson variables "$variables" '{query: $query, variables: $variables}')" \
              https://backboard.railway.com/graphql/v2)"

            if jq -e '(.errors // []) | length > 0' <<<"$response" >/dev/null; then
              echo "Railway API error: $(jq -c '.errors' <<<"$response")" >&2
              return 1
            fi

            jq '.data' <<<"$response"
          }

          token_scope="$(railway_graphql 'query { projectToken { projectId environmentId } }')"
          project_id="$(jq -r '.projectToken.projectId' <<<"$token_scope")"
          environment_id="$(jq -r '.projectToken.environmentId' <<<"$token_scope")"
          services="$(railway_graphql \
            'query($projectId: String!) { project(id: $projectId) { services { edges { node { id name } } } } }' \
            "$(jq -n --arg projectId "$project_id" '{projectId: $projectId}')")"

          start_deployment() {
            local service_name="$1"
            local image="$IMAGE_NAMESPACE/shadow-cloud/$service_name:$VERSION"
            local service_id
            local variables

            service_id="$(jq -r --arg name "$service_name" '.project.services.edges[].node | select(.name == $name) | .id' <<<"$services")"
            if [[ -z "$service_id" ]]; then
              echo "Railway service $service_name was not found." >&2
              return 1
            fi

            variables="$(jq -n \
              --arg serviceId "$service_id" \
              --arg environmentId "$environment_id" \
              --arg image "$image" \
              '{serviceId: $serviceId, environmentId: $environmentId, input: {source: {image: $image}}}')"
            railway_graphql \
              'mutation($serviceId: String!, $environmentId: String!, $input: ServiceInstanceUpdateInput!) { serviceInstanceUpdate(serviceId: $serviceId, environmentId: $environmentId, input: $input) }' \
              "$variables" >/dev/null

            railway_graphql \
              'mutation($serviceId: String!, $environmentId: String!) { serviceInstanceDeployV2(serviceId: $serviceId, environmentId: $environmentId) }' \
              "$(jq 'del(.input)' <<<"$variables")" | jq -r '.serviceInstanceDeployV2'
          }

          wait_for_deployment() {
            local service_name="$1"
            local deployment_id="$2"
            local deadline=$((SECONDS + 900))
            local status="UNKNOWN"

            while (( SECONDS < deadline )); do
              status="$(railway_graphql \
                'query($id: String!) { deployment(id: $id) { status } }' \
                "$(jq -n --arg id "$deployment_id" '{id: $id}')" | jq -r '.deployment.status')"

              case "$status" in
                SUCCESS)
                  echo "$service_name deployed $VERSION."
                  return 0
                  ;;
                FAILED | CRASHED | REMOVED | SKIPPED)
                  echo "$service_name deployment $deployment_id ended with status $status." >&2
                  return 1
                  ;;
              esac

              sleep 10
            done

            echo "Timed out waiting for $service_name deployment $deployment_id (last status: $status)." >&2
            return 1
          }

          # The API applies database migrations on startup, so it must be healthy
          # before the web app and bot move to the new release.
          api_deployment="$(start_deployment api)"
          echo "Deploying api $VERSION ($api_deployment)."
          wait_for_deployment api "$api_deployment"

          web_deployment="$(start_deployment web)"
          echo "Deploying web $VERSION ($web_deployment)."
          bot_deployment="$(start_deployment bot)"
          echo "Deploying bot $VERSION ($bot_deployment)."

          failed=0
          wait_for_deployment web "$web_deployment" || failed=1
          wait_for_deployment bot "$bot_deployment" || failed=1
          exit "$failed"
