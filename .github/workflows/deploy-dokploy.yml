name: Publish and Deploy Containers

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release_tag:
        description: Semantic release tag to deploy (for example, 0.11.0)
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: dokploy-production
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate release
    runs-on: ubuntu-latest
    outputs:
      image_namespace: ${{ steps.release.outputs.image_namespace }}
      release_sha: ${{ steps.release.outputs.release_sha }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out deployment branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.18.0

      - name: Validate release version
        id: release
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
        run: |
          set -euo pipefail

          git fetch --force --tags origin
          if ! release_sha="$(git rev-parse --verify "$RELEASE_TAG^{commit}" 2>/dev/null)"; then
            echo "Release tag $RELEASE_TAG does not exist or does not point to a commit." >&2
            exit 1
          fi

          if ! git merge-base --is-ancestor "$release_sha" HEAD; then
            echo "Release $RELEASE_TAG is not contained in $DEFAULT_BRANCH." >&2
            exit 1
          fi

          version="${RELEASE_TAG#refs/tags/}"
          version="${version#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag $RELEASE_TAG is not semantic." >&2
            exit 1
          fi
          export RELEASE_VERSION="$version"

          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";

          const expectedVersion = process.env.RELEASE_VERSION;
          const versions = new Map([
            ["package.json", JSON.parse(readFileSync("package.json", "utf8")).version],
            [
              "apps/desktop/src-tauri/tauri.conf.json",
              JSON.parse(readFileSync("apps/desktop/src-tauri/tauri.conf.json", "utf8")).version,
            ],
          ]);

          for (const [path, pattern] of [
            ["apps/desktop/src-tauri/Cargo.toml", /\[package\][\s\S]*?\nversion\s*=\s*"([^"]+)"/],
            ["apps/desktop/src-tauri/Cargo.lock", /\[\[package\]\]\r?\nname\s*=\s*"shadow-cloud-desktop"\r?\nversion\s*=\s*"([^"]+)"/],
          ]) {
            const match = readFileSync(path, "utf8").match(pattern);
            if (!match) throw new Error(`Version not found in ${path}.`);
            versions.set(path, match[1]);
          }

          const mismatches = [...versions].filter(
            ([, currentVersion]) => currentVersion !== expectedVersion,
          );
          if (mismatches.length > 0) {
            const details = mismatches
              .map(([path, currentVersion]) => `${path}: ${currentVersion}`)
              .join("\n");
            throw new Error(
              `Release ${expectedVersion} does not match the deployment branch:\n${details}\n` +
                "Bump versions through a pull request before publishing or manually dispatching the release.",
            );
          }
          NODE

          echo "image_namespace=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build and publish ${{ matrix.service }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: API
            image: shadow-cloud/api
            cache_scope: shadow-cloud-api
            dockerfile: apps/api/Dockerfile
          - service: Web
            image: shadow-cloud/web
            cache_scope: shadow-cloud-web
            dockerfile: apps/web/Dockerfile
          - service: Bot
            image: shadow-cloud/bot
            cache_scope: shadow-cloud-bot
            dockerfile: apps/bot/Dockerfile
    steps:
      - name: Check out release source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build and publish image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          build-args: |
            SHADOW_CLOUD_VERSION=${{ needs.prepare.outputs.version }}
          tags: |
            ${{ needs.prepare.outputs.image_namespace }}/${{ matrix.image }}:${{ needs.prepare.outputs.version }}
            ${{ needs.prepare.outputs.image_namespace }}/${{ matrix.image }}:latest
            ${{ needs.prepare.outputs.image_namespace }}/${{ matrix.image }}:sha-${{ needs.prepare.outputs.release_sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.release_sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}

  deploy:
    name: Trigger Dokploy deployment
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Check out deployment branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Trigger Dokploy deployment
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DOKPLOY_DEPLOY_URL: ${{ secrets.DOKPLOY_DEPLOY_URL }}
          RELEASE_NAME: ${{ github.event_name == 'release' && github.event.release.name || inputs.release_tag }}
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
        run: |
          set -euo pipefail

          if [[ -z "$DOKPLOY_DEPLOY_URL" ]]; then
            echo "The DOKPLOY_DEPLOY_URL repository secret is not configured." >&2
            exit 1
          fi

          deployment_sha="$(git rev-parse HEAD)"
          repository_files="$(git ls-tree -r --name-only HEAD)"
          modified_json="$(printf '%s\n' "$repository_files" | jq -R 'select(length > 0)' | jq -s '.')"
          payload="$(jq -n \
            --arg ref "refs/heads/$DEFAULT_BRANCH" \
            --arg id "$deployment_sha" \
            --arg message "Deploy ${RELEASE_NAME:-$RELEASE_TAG}" \
            --argjson modified "$modified_json" \
            '{
              ref: $ref,
              after: $id,
              commits: [{ id: $id, message: $message, modified: $modified }],
              head_commit: { id: $id, message: $message, modified: $modified }
            }')"

          response_file="$(mktemp)"
          status="$(curl \
            --silent \
            --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/json' \
            --header 'X-GitHub-Event: push' \
            --data "$payload" \
            "$DOKPLOY_DEPLOY_URL")"

          cat "$response_file"

          if [[ ! "$status" =~ ^2[0-9][0-9]$ ]]; then
            echo "Dokploy returned HTTP $status." >&2
            exit 1
          fi
