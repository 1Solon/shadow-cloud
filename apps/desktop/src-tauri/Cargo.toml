[package]
name = "shadow-cloud-companion"
version = "0.16.1"
description = "Shadow Cloud Companion"
authors = ["Shadow-Cloud"]
edition = "2021"

[lib]
name = "shadow_cloud_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
dotenvy = "=0.15.7"
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
async-trait = "=0.1.89"
keyring = "=4.2.0"
tauri = { version = "=2.11.5", features = ["tray-icon"] }
tauri-plugin-dialog = "=2.7.3"
tauri-plugin-opener = "=2.5.5"
tauri-plugin-single-instance = "=2.4.4"
tauri-plugin-updater = "=2.11.0"
base64 = "=0.22.1"
minisign-verify = "=0.2.5"
semver = "=1.0.28"
getrandom = "=0.3.4"
shadow-cloud-companion-engine = { path = "../engine" }
tokio = { version = "=1.52.3", features = ["sync", "time", "macros"] }
reqwest = { version = "=0.13.4", default-features = false, features = ["rustls", "json", "system-proxy", "multipart"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[dev-dependencies]
tempfile = "=3.23.0"
rcgen = "=0.14.7"
rustls = { version = "=0.23.41", default-features = false, features = ["ring", "std"] }

[target.'cfg(target_os = "macos")'.dependencies]
plist = "=1.10.0"
objc2 = "=0.6.4"
objc2-foundation = "=0.3.2"
objc2-user-notifications = "=0.3.2"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSWorkspace"] }
block2 = "=0.6.2"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "=5.17.0", default-features = false, features = ["tokio"] }
futures-util = "=0.3.32"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "=0.61.3", features = ["Data_Xml_Dom", "Foundation", "UI_Notifications", "Win32_System_Power", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell"] }
winreg = "=0.55.0"
