[package]
name = "shadow-cloud-desktop"
version = "0.0.0-dev"
description = "Shadow-Cloud desktop sync client"
authors = ["Shadow-Cloud"]
edition = "2021"

[lib]
name = "shadow_cloud_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.0", features = [] }

[dependencies]
tauri = { version = "=2.12.0", features = ["tray-icon"] }
tauri-plugin-dialog = "=2.8.0"
tauri-plugin-fs = "=2.6.0"
tauri-plugin-opener = "=2.6.0"
tauri-plugin-single-instance = "=2.5.0"
tauri-plugin-store = "=2.5.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "=2.13.0"
