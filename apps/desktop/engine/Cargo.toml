[package]
name = "shadow-cloud-companion-engine"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
async-trait = "=0.1.89"
rusqlite = { version = "=0.38.0", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
